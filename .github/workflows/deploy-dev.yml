# Deploys to the Forge development environment on every merge to main.
# Requires repository secrets FORGE_EMAIL and FORGE_API_TOKEN (Atlassian API token of the owner).
# Production deploys stay manual (`npm run deploy:prod`) until the paid tier exists.
name: deploy-dev
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FORGE_DEPLOY_ENABLED == 'true' }}
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Skip until registered
        id: reg
        run: if grep -q REPLACE-WITH-FORGE-REGISTER manifest.yml; then echo skip=true >> $GITHUB_OUTPUT; fi
      - run: npm ci
        if: steps.reg.outputs.skip != 'true'
      - run: npx forge settings set usage-analytics false
        if: steps.reg.outputs.skip != 'true'
      - run: npx forge lint
        if: steps.reg.outputs.skip != 'true'
      - run: npx forge deploy -e development --non-interactive
        if: steps.reg.outputs.skip != 'true'
      # T22: the "Runs on Atlassian" report, in the log of every deploy. Informational — the static
      # no-egress guard in `npm run validate:manifest` (ci.yml) is what blocks a regression.
      - name: Runs on Atlassian eligibility
        run: npx forge eligibility -e development --non-interactive
        if: steps.reg.outputs.skip != 'true'
        continue-on-error: true
